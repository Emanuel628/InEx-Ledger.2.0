[phases.setup]
nixPkgs = ["nodejs_20"]

[phases.install]
cmds = [
  "cd In-Ex-Ledger-API && npm ci",
  "cd In-Ex-Ledger-API && npm --prefix frontend-v3 ci"
]

[phases.build]
cmds = [
  "cd In-Ex-Ledger-API && npm run build:frontend-v3",
  "cd In-Ex-Ledger-API && node -e \"const fs=require('fs'); if (!fs.existsSync('public/app-v3/index.html')) process.exit(1)\""
]

[start]
cmd = "cd In-Ex-Ledger-API && npm start"
