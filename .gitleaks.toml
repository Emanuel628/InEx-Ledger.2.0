# gitleaks configuration for InEx Ledger.
#
# The default ruleset stays enabled so new upstream detectors apply here.
# Keep exceptions narrow: browser state, tokens, and credentials must never be
# hidden by broad test or documentation path allowlists.

[extend]
useDefault = true

[allowlist]
description = "Narrow placeholder and generated-file exceptions."
paths = [
  # Documented placeholder env files. Real .env files are gitignored.
  '''(^|/)\.env\.example$''',
  '''(^|/)\.env\.test\.example$''',

  # Lockfiles are auto-generated and rule-noisy.
  '''(^|/)In-Ex-Ledger-API/package-lock\.json$''',
  '''(^|/)In-Ex-Ledger-API/frontend-v3/package-lock\.json$''',
  '''(^|/)pdf-worker/package-lock\.json$'''
]

# Placeholder patterns deliberately used in examples and tests.
regexes = [
  '''sk_test_x{6,}''',
  '''whsec_x{6,}''',
  '''price_x{6,}''',
  '''re_x{6,}''',
  '''sk_test_[0-9]{3}''',
  '''whsec_[0-9]{3}''',
  '''re_test_[0-9A-Za-z_-]{3,}''',
  '''test-jwt-secret[-_a-z0-9]*''',
  '''test-csrf-secret[-_a-z0-9]*''',
  '''test-export[-_a-z0-9]*secret[-_a-z0-9]*''',
  '''change-me-to-a-long-random-string''',
  '''xxxxxxxxxxxxxxxxxxxx'''
]
