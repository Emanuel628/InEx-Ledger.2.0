name: Dependency Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1"

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-1.0, AGPL-3.0

  npm-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        package:
          - name: api
            path: In-Ex-Ledger-API
            lockfile: In-Ex-Ledger-API/package-lock.json
            audit: npm run security:deps
          - name: frontend-v3
            path: In-Ex-Ledger-API/frontend-v3
            lockfile: In-Ex-Ledger-API/frontend-v3/package-lock.json
            audit: npm audit --omit=dev --audit-level=high
          - name: pdf-worker
            path: pdf-worker
            lockfile: pdf-worker/package-lock.json
            audit: npm audit --omit=dev --audit-level=high

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ matrix.package.lockfile }}

      - name: Install ${{ matrix.package.name }} dependencies
        working-directory: ${{ matrix.package.path }}
        run: npm ci

      - name: Audit ${{ matrix.package.name }} production dependencies
        working-directory: ${{ matrix.package.path }}
        run: ${{ matrix.package.audit }}
